<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>สมัครสมาชิก — โมเดล ฟิกเกอร์ by แมวแชร์</title>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root { --pink: #e8547a; --pink-lt: #fdf0f3; --pink-md: #fbd5de; --dark: #1a1a2e; --gray: #6b7280; --radius: 20px; }
  body {
    font-family: 'Sarabun', sans-serif; min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    background: linear-gradient(135deg, #fff5f7 0%, #f9fafb 60%, #fff 100%);
    padding: 24px; position: relative; overflow: hidden;
  }
  body::before { content:''; position: fixed; top:-30%; right:-20%; width:600px; height:600px; background: radial-gradient(circle, #fbd5de44, transparent 65%); pointer-events:none; }

  .card { background: white; border-radius: var(--radius); padding: 40px 36px; width: 100%; max-width: 460px; box-shadow: 0 24px 60px rgba(232,84,122,0.12), 0 4px 16px rgba(0,0,0,0.06); position: relative; z-index: 1; }
  .logo { font-family: 'Playfair Display', serif; font-size: 22px; color: var(--pink); text-align: center; margin-bottom: 6px; text-decoration: none; display: block; }
  .subtitle { text-align: center; color: var(--gray); font-size: 14px; margin-bottom: 32px; }
  h2 { font-size: 22px; font-weight: 700; text-align: center; margin-bottom: 28px; }

  .field { margin-bottom: 16px; }
  label { display: block; font-size: 14px; font-weight: 500; margin-bottom: 6px; }
  input { width: 100%; padding: 12px 16px; border: 1.5px solid #e5e7eb; border-radius: 12px; font-family: 'Sarabun', sans-serif; font-size: 15px; background: #fafafa; outline: none; transition: all 0.2s; }
  input:focus { border-color: var(--pink); box-shadow: 0 0 0 3px rgba(232,84,122,0.12); background: white; }
  .hint { font-size: 12px; color: var(--gray); margin-top: 4px; }

  .btn-submit { width: 100%; padding: 14px; background: var(--pink); color: white; border: none; border-radius: 50px; cursor: pointer; font-size: 16px; font-weight: 600; box-shadow: 0 8px 20px rgba(232,84,122,0.35); transition: all 0.2s; margin-top: 8px; }
  .btn-submit:hover { opacity: 0.9; transform: translateY(-1px); }
  .btn-submit:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

  .msg { text-align: center; margin-top: 14px; font-size: 14px; min-height: 20px; }
  .msg.error { color: #dc2626; } .msg.success { color: #16a34a; } .msg.info { color: var(--gray); }

  .divider { display: flex; align-items: center; gap: 12px; margin: 20px 0; }
  .divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: #e5e7eb; }
  .divider span { font-size: 13px; color: var(--gray); }
  .links { text-align: center; font-size: 14px; color: var(--gray); }
  .links a { color: var(--pink); font-weight: 600; text-decoration: none; }
  .links a:hover { text-decoration: underline; }

  .password-strength { height: 4px; border-radius: 2px; background: #e5e7eb; margin-top: 8px; overflow: hidden; }
  .strength-bar { height: 100%; border-radius: 2px; transition: width 0.3s, background 0.3s; width: 0; }
</style>
</head>
<body>

<div class="card">
  <a class="logo" href="index.html">🐾 โมเดล ฟิกเกอร์ by แมวแชร์</a>
  <p class="subtitle">สมัครสมาชิกเพื่อเริ่มสั่งซื้อ</p>
  <h2>สมัครสมาชิก</h2>

  <div class="field">
    <label for="username">ชื่อบัญชี</label>
    <input type="text" id="username" placeholder="ตั้งชื่อบัญชีของคุณ" autocomplete="username">
  </div>
  <div class="field">
    <label for="email">อีเมล</label>
    <input type="email" id="email" placeholder="example@email.com" autocomplete="email">
  </div>
  <div class="field">
    <label for="password">รหัสผ่าน</label>
    <input type="password" id="password" placeholder="อย่างน้อย 6 ตัวอักษร" autocomplete="new-password">
    <div class="password-strength"><div class="strength-bar" id="strengthBar"></div></div>
  </div>
  <div class="field">
    <label for="confirm">ยืนยันรหัสผ่าน</label>
    <input type="password" id="confirm" placeholder="กรอกรหัสผ่านอีกครั้ง" autocomplete="new-password">
  </div>

  <button id="regBtn" class="btn-submit" onclick="register()">สมัครสมาชิก</button>
  <div id="msg" class="msg"></div>

  <div class="divider"><span>มีบัญชีแล้ว?</span></div>
  <div class="links"><a href="login.html">เข้าสู่ระบบ</a></div>
</div>

<script src="config.js"></script>
<script>
if (Session.user) window.location.href = "orders.html";

document.getElementById("password").addEventListener("input", function() {
  const val = this.value;
  const bar = document.getElementById("strengthBar");
  let strength = 0;
  if (val.length >= 6) strength++;
  if (val.length >= 10) strength++;
  if (/[A-Z]/.test(val)) strength++;
  if (/[0-9]/.test(val)) strength++;
  const colors = ["#dc2626","#f97316","#eab308","#16a34a"];
  bar.style.width = (strength * 25) + "%";
  bar.style.background = colors[strength - 1] || "#e5e7eb";
});

function setMsg(text, type) {
  const el = document.getElementById("msg");
  el.textContent = text; el.className = "msg " + (type || "info");
}

async function register() {
  const user = document.getElementById("username").value.trim();
  const email = document.getElementById("email").value.trim();
  const pass = document.getElementById("password").value;
  const confirm = document.getElementById("confirm").value;
  const btn = document.getElementById("regBtn");

  if (!user || !email || !pass || !confirm) { setMsg("กรุณากรอกข้อมูลให้ครบ", "error"); return; }
  if (pass.length < 6) { setMsg("รหัสผ่านต้องมีอย่างน้อย 6 ตัวอักษร", "error"); return; }
  if (pass !== confirm) { setMsg("รหัสผ่านไม่ตรงกัน", "error"); return; }
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { setMsg("รูปแบบอีเมลไม่ถูกต้อง", "error"); return; }

  setMsg("กำลังสมัครสมาชิก...", "info");
  btn.disabled = true;

  try {
    const res = await apiCall("register", { username: user, email: email, password: pass });
    btn.disabled = false;
    if (res.status === "success") {
      Session.user = user;
      setMsg("สมัครสำเร็จ! กำลังพาไป...", "success");
      setTimeout(() => window.location.href = "orders.html", 700);
    } else {
      setMsg(res.message || "เกิดข้อผิดพลาด", "error");
    }
  } catch (err) {
    btn.disabled = false;
    setMsg("ระบบขัดข้อง กรุณาลองใหม่", "error");
    console.error(err);
  }
}
</script>
</body>
</html>
